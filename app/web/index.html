<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bar screen dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="idle" width="960" height="240"></canvas>
  <canvas id="viz" width="1280" height="320"></canvas>
  <canvas id="bars" width="1920" height="480"></canvas>
  <div id="shade"></div>

  <main id="info">
    <div id="art"><div id="artBlur"></div><img id="artImg" alt=""></div>
    <div id="text">
      <div id="player"></div>
      <div id="title"></div>
      <div id="artist"></div>
      <div id="progress"><div id="bar"><div id="fill"></div></div>
        <div id="times"><span id="pos"></span><span id="len"></span></div></div>
    </div>
  </main>

  <div id="clockSmall"><span id="clockTime"></span><span id="temp"></span></div>
  <div id="idleClock"><div id="idleTime"></div><div id="idleDate"></div></div>
  <div id="debug"></div>

  <script src="vendor/butterchurn.min.js"></script>
  <script src="vendor/butterchurnPresets.min.js"></script>
  <script src="vendor/butterchurnPresetsExtra.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
